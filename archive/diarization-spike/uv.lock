version = 1
revision = 3
requires-python = ">=3.12, <3.14"
resolution-markers = [
    "python_full_version >= '3.13' and sys_platform == 'win32'",
    "python_full_version < '3.13' and sys_platform == 'win32'",
    "python_full_version >= '3.13' and sys_platform == 'emscripten'",
    "python_full_version < '3.13' and sys_platform == 'emscripten'",
    "python_full_version >= '3.13' and sys_platform != 'darwin' and sys_platform != 'emscripten' and sys_platform != 'linux' and sys_platform != 'win32'",
    "python_full_version >= '3.13' and sys_platform == 'darwin'",
    "python_full_version >= '3.13' and sys_platform == 'linux'",
    "python_full_version < '3.13' and sys_platform != 'darwin' and sys_platform != 'emscripten' and sys_platform != 'linux' and sys_platform != 'win32'",
    "python_full_version < '3.13' and sys_platform == 'darwin'",
    "python_full_version < '3.13' and sys_platform == 'linux'",
]

[options]
exclude-newer = "0001-01-01T00:00:00Z" # This has no effect and is included for backwards compatibility when using relative exclude-newer values.
exclude-newer-span = "P7D"

[manifest]
constraints = [
    { name = "guardrails-ai", specifier = "!=0.10.1" },
    { name = "mistralai", specifier = "!=2.4.6" },
    { name = "multidict", specifier = ">=6.9.1" },
    { name = "werkzeug", specifier = ">=3.1.9" },
]

[[package]]
name = "chatex-retired-diarization-reference"
version = "0.1.0"
source = { virtual = "." }

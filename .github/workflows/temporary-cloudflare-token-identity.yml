name: Temporary Cloudflare token identity

on:
  workflow_dispatch:

permissions: {}

jobs:
  identify:
    if: github.repository == 'tsilva/chatex' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    environment: Production
    steps:
      - name: Read Cloudflare token identity without changing resources
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set +x
          python3 -I - <<'PY'
          import json
          import os
          import re
          import sys
          import urllib.request

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          def identify():
              token = os.environ.get("CLOUDFLARE_API_TOKEN", "")
              if not token or "\r" in token or "\n" in token:
                  raise ValueError()
              url = "https://api.cloudflare.com/client/v4/user/tokens/verify"
              request = urllib.request.Request(
                  url, method="GET",
                  headers={"Authorization": "Bearer " + token,
                           "Accept": "application/json"},
              )
              opener = urllib.request.build_opener(
                  urllib.request.ProxyHandler({}), NoRedirect()
              )
              with opener.open(request, timeout=30) as response:
                  raw = response.read(16385)
                  if response.status != 200 or len(raw) > 16384:
                      raise ValueError()
              data = json.loads(raw)
              result = data.get("result", {})
              token_id = result.get("id", "")
              if (data.get("success") is not True
                      or result.get("status") != "active"
                      or not isinstance(token_id, str)
                      or re.fullmatch(r"[0-9a-f]{32}", token_id) is None
                      or token_id == token):
                  raise ValueError()
              print(json.dumps({"cloudflare_token_id": token_id,
                                "status": "active"}, sort_keys=True))

          try:
              identify()
          except Exception:
              print("Token identity verification failed; provider details suppressed.")
              sys.exit(1)
          PY
